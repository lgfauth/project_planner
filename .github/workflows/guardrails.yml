name: Guardrails

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  verificar:
    name: Verificar guardrails do planejamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir commit base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 scripts/verificar-guardrails.py
